<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Animated / Dynamic Background Network Lines & Pulses -->
  <g opacity="0.25">
    <path d="M 100,160 Q 300,60 600,160 T 1100,160" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 100,200 Q 400,280 700,180 T 1100,220" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="8,8">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle cx="200" cy="110" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="230" r="5" fill="#a855f7">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="4" fill="#f43f5e">
      <animate attributeName="r" values="2;5;2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Message Flow Node Highlights (Positioned cleanly around layout) -->
  <g stroke="#ffffff" stroke-opacity="0.15" fill="none">
    <rect x="50" y="40" width="1100" height="240" rx="12" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Signal Bars (Background decorative graph/flow) -->
  <g opacity="0.3" transform="translate(920, 70)">
    <rect x="0" y="80" width="12" height="60" rx="4" fill="#6366f1">
      <animate attributeName="height" values="60;100;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;40;100;80" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="50" width="12" height="90" rx="4" fill="#a855f7">
      <animate attributeName="height" values="90;40;110;90" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;100;30;50" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="30" width="12" height="110" rx="4" fill="#ec4899">
      <animate attributeName="height" values="110;70;130;110" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;70;10;30" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="60" width="12" height="80" rx="4" fill="#38bdf8">
      <animate attributeName="height" values="80;120;50;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;20;90;60" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Unobscured -->
  <!-- Top Badge / Category Tag -->
  <g transform="translate(80, 65)">
    <rect width="280" height="32" rx="16" fill="url(#accentGrad)" opacity="0.9" />
    <text x="140" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE ARCHITECTURE</text>
  </g>

  <!-- Title -->
  <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Enterprise Message Broker 🚀
  </text>

  <!-- Subtitle -->
  <text x="80" y="190" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Curated List of Event Streaming, Message Queues &amp; Distributed Pub/Sub Systems
  </text>

  <!-- Feature Pill Tags in Foreground -->
  <g transform="translate(80, 220)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="70" y="21" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ High Throughput</text>

    <!-- Pill 2 -->
    <rect x="152" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="224" y="21" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Cloud &amp; On-Prem</text>

    <!-- Pill 3 -->
    <rect x="309" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="384" y="21" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 SaaS &amp; Open Source</text>
  </g>
</svg>
